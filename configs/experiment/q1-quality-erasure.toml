# Frozen Q1 expert-erasure quality probe. Forward passes on the frozen base
# base checkpoint over WikiText-2; no training, no model download, no second
# checkpoint. Measures whether quality loss is controlled by missing routed
# mass (AX4's assumed-robustness contract) or by which/where experts are lost.
run_id = "q1-quality-erasure"
run_dir = "artifacts/runs/q1-quality-erasure"
output_dir = "artifacts/runs/q1-quality-erasure/analysis/q1"
tail_output_dir = "artifacts/runs/q1-quality-erasure/analysis/q1_tail"
# Q1-B null-drop mechanism probe (commits to null; renormalize dropped).
q1b_output_dir = "artifacts/runs/q1-quality-erasure/analysis/q1b_null"
seed = 7

[probe]
# WikiText-2 raw validation, loaded directly from the local HF cache parquet.
token_budget = 4096
chunk_size = 512
mass_targets = [0.01, 0.05, 0.125, 0.25, 0.50]
positionings = ["mass_omission", "random_within_route", "mass_adversarial"]
policies = ["renormalize", "null"]

[decode_leg]
enabled = true
prefix_tokens = 64
max_new_tokens = 24

# AX4-faithful tail-event probe: only a small fraction of tokens suffer an
# erasure, each dropping an exact expert count in a bounded run of consecutive
# layers. This is the regime AX4's deadline contract actually relies on
# (degraded-wave fraction ~0.9-1%), as opposed to the mass-budget probe above
# which erases every token in every layer.
[tail_probe]
token_budget = 16384
chunk_size = 512
incidence = [0.002, 0.005, 0.009, 0.02, 0.05, 0.10, 0.20, 0.30]
run_lengths = [1, 2, 4, 8]
experts_per_drop = 1
positioning = "mass_omission"
policies = ["renormalize", "null"]
# AX4 headline candidate: degraded-wave fraction ~0.009-0.0093.
ax4_anchor_incidence = 0.009
headline_run_length = 1

[tail_gate]
# Frozen tail primary cell: one expert in one layer, conditional on the tokens
# that actually suffered erasure, at the AX4-anchored incidence.
headline_policy = "renormalize"
headline_positioning = "mass_omission"
headline_incidence = 0.009
headline_run_length = 1
experts_per_drop = 1
max_mean_forward_kl = 0.05
min_top1_agreement = 0.99
max_ppl_ratio = 1.05
large_divergence_kl = 2.0
large_divergence_max_fraction = 0.01
monotone_slack = 1e-6

[decision_gate]
# Frozen primary cell: renormalize + mass-omission at headline m = 0.125.
headline_policy = "renormalize"
headline_positioning = "mass_omission"
headline_m = 0.125
max_mean_forward_kl = 0.05
min_top1_agreement = 0.99
max_ppl_ratio = 1.05
monotone_slack = 1e-6
# Kill signal: sub-1% mass causing frequent large divergence.
large_divergence_kl = 2.0
large_divergence_max_fraction = 0.01

# Q1-B null-drop mechanism probe. Commits to null-drop (renormalize dropped as
# a strategy). Decisive question: is null-drop quality loss controlled by the
# number and placement of dropped expert-layers (additive and monotone in
# depth, as the additive-residual hypothesis predicts), or does it compound /
# depend on which layers / leak across tokens?
[q1b_probe]
token_budget = 16384
chunk_size = 512
incidence = 0.009                # AX4 anchor degraded-wave fraction
depth_run_lengths = [1, 2, 4, 8] # primary sweep (AX4 worst case = 8)
spacing_scan = true
# For each run length: contiguous (gap=1) vs spaced every-`gap`th layer.
spacing_runs = [{ run_length = 2, gap = 7 }, { run_length = 4, gap = 3 }]
layer_order_scan = true          # one expert, one layer, all 16 layers
cross_token_scan = true
max_cross_offset = 8             # downstream offsets p+1..p+8

# Frozen Q1-B gate: GO iff the depth sweep is monotone in L, has no super-linear
# per-layer marginal blow-up by the AX4 worst case, and keeps <=1% large
# divergence at L=8, all conditional on affected tokens.
[q1b_gate]
headline_policy = "null"
headline_positioning = "mass_omission"
incidence = 0.009
headline_run_length = 8          # AX4 worst case
experts_per_drop = 1
max_superlinear_ratio = 3.0      # last/first per-layer marginal ratio
large_divergence_kl = 2.0
large_divergence_max_fraction = 0.01
monotone_slack = 1e-6
